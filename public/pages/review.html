<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recturner - Book Details</title>
    <link rel="shortcut icon" href="../images/R.jpg" type="image/x-icon">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .book-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .book-cover {
            flex: 0 0 auto;
            margin-right: 20px;
        }

        .book-cover img {
            width: 150px;
            height: 200px;
            object-fit: cover;
            border: 2px solid #3d4122;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .book-info {
            flex: 1;
        }

        .book-info h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .book-info p {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .book-info button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .book-info button:hover {
            background-color: #0056b3;
        }

        .description, .details, .review-section {
            margin-bottom: 20px;
        }

        .description h3, .details h3, .review-section h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .rating {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .star {
            font-size: 24px;
            cursor: pointer;
            color: #ccc;
        }

        .star.selected {
            color: #f39c12;
        }

        a{
            text-decoration: none;
        }

        .review-section textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .review-section button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .review-section button:hover {
            background-color: #0056b3;
        }

        .review-list {
            margin-top: 20px;
        }

        .review-item {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
        }

        .review-item p {
            margin: 5px 0;
        }

        .review-item button {
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .review-item button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="../pages/homepage.html"><div class="logo">Recturner</div></a>
        <div class="nav-links">
            <a href="../pages/homepage.html">Home</a>
            <a href="../pages/profile.html">Profile</a>
            <a href="../pages/your-books.html">Your Books</a>
            <a href="../pages/about.html">About</a>
            <a href="../pages/signup.html">Sign Up</a>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for books..." />
            <button id="search-btn">Search</button>
            <ul id="suggestions-list"></ul>
        </div>
    </div>

    <div class="container">
        <div class="book-header">
            <div class="book-cover">
                <img id="book-thumbnail" src="default-thumbnail.jpg" alt="Book Thumbnail" />
            </div>
            <div class="book-info">
                <h1 id="book-title">Book Title</h1>
                <p id="book-author">Author: Unknown</p>
                <p id="book-rating">Rating: N/A</p>
                <button id="want-to-read-btn">Want to Read</button>
            </div>
        </div>

        <div class="description">
            <h3>About the Book</h3>
            <p id="book-description">No description available.</p>
        </div>
        
        <div class="review-section">
            <h3>Write a Review</h3>
            <textarea id="review-input" placeholder="Write your review here..."></textarea>
            <h3>Rate the Book</h3>
            <div class="rating" id="rating-stars">
                <span class="star" data-value="1">&#9733;</span>
                <span class="star" data-value="2">&#9733;</span>
                <span class="star" data-value="3">&#9733;</span>
                <span class="star" data-value="4">&#9733;</span>
                <span class="star" data-value="5">&#9733;</span>
            </div>
            <button id="post-review-btn">Post Review</button>

            <h3>Other Reviews</h3>
            <div id="review-list"></div>
        </div>
    </div>

    <script src="../js/review.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
