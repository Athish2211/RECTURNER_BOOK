<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recturner - Your Books</title>
    <link rel="shortcut icon" href="R.jpg" type="image/x-icon">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        h1 {
            margin-top: 30px;
            text-align: center;
            margin-bottom: 30px;
        }

        .book-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .book-item {
            flex: 1 1 calc(25% - 20px);
            display: flex;
            align-items: flex-start;
            background-color: white;
            border: 1px solid ddd;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .book-item img {
            max-width: 150px;
            height: auto;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .book-item h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .book-item p {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .book_item button{
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .book-item button:hover {
            background-color: #0056b3;
        }
        
        @media (max-width: 768px) {
            .book-item {
                flex: 1 1 calc(50% - 20px);
            }
        }

        @media (max-width: 480px) {
            .book-item {
                flex: 1 1 100%;
            }
        }

        a{
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="../pages/homepage.html"><div class="logo">Recturner</div></a>
        <div class="nav-links">
            <a href="../pages/homepage.html">Home</a>
            <a href="../pages/profile.html">Profile</a>
            <a href="../pages/your-books.html">Your Books</a>
            <a href="../pages/about.html">About</a>
            <a href="../pages/signup.html">Sign Up</a>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Explore New Books">
            <button id="search-btn">Search</button>
            <ul id="suggestions-list"></ul> <!-- Suggestions list -->
        </div>
    </div>

    <!-- Main Content -->
    <h1>Your Books</h1>
    <div class="container">
        <div class="book-list" id="your-books-container"></div> <!-- Container for dynamically loaded books -->
    </div>

    <script src="../js/search.js"></script>
    <script src="../js/your-books.js"></script> <!-- Link to your JavaScript file -->
</body>
</html>
