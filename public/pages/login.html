<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recturner - Login</title>
    <link rel="shortcut icon" href="../images/R.jpg" type="image/x-icon">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .background {
            background-image: linear-gradient(to bottom right, rgb(0, 0, 0), rgb(72, 72, 60),rgb(255, 255, 255));
            background-size: cover;
            background-position: center;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .background::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); 
            z-index: -1;
            filter: blur(4px); 
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 30px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            width: 400px;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-group label {
            flex-basis: 40%;
            font-size: 16px;
            font-weight: bold;
        }

        .form-group input {
            flex-basis: 60%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: #000000;
        }

        .login-form button {
            padding: 12px;
            background-color: #000000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            position: center;
            font-size: 16px;
            width:100%;
            transition: background-color 0.3s ease;
        }

        .login-form button:hover {
            background-color: #333435;
        }

        @media (max-width: 600px) {
            .container {
                width: 90%;
            }
            .form-group label,
            .form-group input {
                font-size: 14px;
            }
        }
        .others {
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="logo">Recturner</div>
        <div class="container">
            <h1>Login</h1>
            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="email">Email ID:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required minlength="8">
                </div>

                <button type="submit">Login</button>
                <div class="others">If not a user, <a href="../pages/signup.html">Sign Up</a></div>
            </form>
        </div>
    </div>
    <script src="../js/login.js"></script>
</body>
</html>.
