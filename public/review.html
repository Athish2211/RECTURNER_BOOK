<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recturner - Book Details</title>
    <link rel="shortcut icon" href="R.jpg" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: cursive;
            margin: 0;
            padding: 10px;
            font-size:auto;
        }

        body, html {
            font-family: cursive;
            background-color: #f7f7f7;
            padding-top: 30px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .book-list {
            display: flex;
            flex-direction: column;
        }

        .book-item {
            display: flex;
            align-items: flex-start;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 15px;
            margin-bottom: 20px;
        }

        .book-item img {
            max-width: 150px;
            border-radius: 5px;
            margin-left: 15px;
        }

        .book-details {
            flex: 1;
        }

        .book-item h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .book-item p {
            margin-bottom: 5px;
        }

        .rating {
            font-weight: bold;
        }

        .top-review {
            margin-top: 10px;
        }

        body, html {
            font-family: Arial, sans-serif;
            background-color: #f9f6ef;
            color: #333;
        }

        .book-item {
            background-color: #fffdf7;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">Recturner</div>
        <div class="nav-links">
            <a href="../homepage.html">Home</a>
            <a href="../profile.html">Profile</a>
            <a href="../your-books.html">Your Books</a>
            <a href="../about.html">About</a>
            <a href="../signup.html">Sign Up</a>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for books..." />
            <button id="search-btn">Search</button>
            <ul id="suggestions-list"></ul>
        </div>
    </div>

    <div class="container">
        <div class="book-header">
            <div class="book-cover">
                <img id="book-thumbnail" src="default-thumbnail.jpg" alt="Book Thumbnail" />
            </div>
            <div class="book-info">
                <h1 id="book-title">Book Title</h1>
                <p id="book-author">Author: Unknown</p>
                <p id="book-rating">Rating: N/A</p>
                <button id="want-to-read-btn">Want to Read</button>
            </div>
        </div>

        <div class="description">
            <h3>About the Book</h3>
            <p id="book-description">No description available.</p>
        </div>

        <div class="details">
            <h3>Details</h3>
            <p id="book-details">No additional details available.</p>
        </div>

        <div class="review-section">
            <h3>Write a Review</h3>
            <textarea id="review-input" placeholder="Write your review here..."></textarea>
            <button id="post-review-btn">Post Review</button>

            <h3>Rate the Book</h3>
            <div class="rating" id="rating-stars">
                <span class="star" data-value="1">&#9733;</span>
                <span class="star" data-value="2">&#9733;</span>
                <span class="star" data-value="3">&#9733;</span>
                <span class="star" data-value="4">&#9733;</span>
                <span class="star" data-value="5">&#9733;</span>
            </div>

            <h3>Other Reviews</h3>
            <div id="review-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
