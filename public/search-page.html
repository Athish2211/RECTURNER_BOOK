<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recturner - Search Results</title>
    <link rel="shortcut icon" href="R.jpg" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <style type="text/css">
        * {
            box-sizing: border-box;
            font-family: cursive;
            margin: 0;
            padding: 10px;
            font-size:auto;
        }

        body, html {
            font-family: cursive;
            background-color: #fffdf7;
            padding-top: 30px;
        }

        .flex-container {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin: 20px 0;
        }

        .flex-container img {
            width: 150px;
            height: 200px;
            object-fit: cover;
            margin: 10px;
            border: 2px solid #3d4122;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top:30px;
            text-align: center;
            margin-bottom: 30px;
        }

    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">Recturner</div>
        <div class="nav-links">
            <a href="../homepage.html">Home</a>
            <a href="../profile.html">Profile</a>
            <a href="../your-books.html">Your Books</a>
            <a href="../about.html">About</a>
            <a href="../signup.html">Sign Up</a>          
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Explore New Books">
            <button id="search-btn">Search</button>
            <ul id="suggestions-list"></ul> <!-- Suggestions list -->
        </div>
    </div>

    <h1>Search Results</h1>
    <div id="search-results" class="flex-container"></div>
    <script src="script.js"></script> <!-- Link to your JavaScript file -->
</body>
</html>
