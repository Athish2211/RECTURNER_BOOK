<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recturner - Search Results</title>
    <link rel="shortcut icon" href="R.jpg" type="image/x-icon">
    <link rel="stylesheet" href="cssreset.css">
    <style type="text/css">
        * {
            box-sizing: border-box;
            font-family: cursive;
            margin: 0;
            padding: 10px;
            font-size: auto;
        }

        body, html {
            font-family: cursive;
            background-color: #f7f7f7;
            padding-top: 30px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #3d4122;
            color: white;
            padding: 6px;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            height: 70px;
        }

        .navbar .logo {
            font-size: 30px;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }

        .navbar .nav-links {
            display: flex;
            gap: 20px;
            font-size: 18px;
        }

        .navbar .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            padding: 5px 10px;
        }

        .navbar .nav-links a:hover {
            background-color: #5a6430;
            border-radius: 5px;
        }

        .search {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            border-radius: 20px;
            padding: 5px;
        }

        .search-input {
            padding: 8px;
            border: none;
            border-radius: 15px;
            width: 250px;
            font-size: 16px;
        }

        .search-btn {
            padding: 10px;
            background-color: #3d4122;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }

        .search-btn:hover {
            background-color: #000;
        }

        .flex-container {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-top: 80px; /* Adjusting for fixed navbar */
        }

        .flex-container img {
            width: 150px; 
            height: 200px; 
            object-fit: cover; 
            margin-bottom: 20px; 
        }

        h3 {
            color:#3d4122; 
            margin-top :20px; 
            font-size :22px; 
            margin-left :10px; 
        }

        .contactus {
            width :100%; 
            height :100px; 
            background-color :#3d4122; 
            color:white; 
            text-align:center; 
            padding :20px 0; 
        }

        

        .book-item {
            width: 150px;
            text-align: center;
            margin: 15px;
            padding: 10px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .book-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
        }

        .book-item h4 {
            font-size: 16px;
            margin-top: 10px;
            color: #3d4122;
        }

        .book-item p {
            font-size: 14px;
            color: #777;
        }

        #suggestions-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
            background-color: white;
            border: 1px solid #ccc;
            position: absolute;
            z-index: 1;
            width: 250px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #suggestions-list li {
            padding: 8px;
            cursor: pointer;
        }

        #suggestions-list li:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">Recturner</div>
        <div class="nav-links">
            <a href="../homepage.html">Home</a>
            <a href="../profile.html">Profile</a>
            <a href="../your-books.html">Your Books</a>
            <a href="../about.html">About</a>
            <a href="../signup.html">Sign Up</a>          
        </div>
        <div class="search">
            <input type="text" id="search-input" placeholder="Search Books">
            <button id="search-btn">Search</button>
            <ul id="suggestions-list"></ul> <!-- Suggestions list -->
        </div>
    </div>

    <h3>Search Results ></h3>
    <div id="search-results" class="flex-container"></div>

    <div class="contactus">
        Contact us
        <p>+91 9181143298</p>
    </div>

    <script src="script.js"></script> <!-- Link to your JavaScript file -->
</body>
</html>
