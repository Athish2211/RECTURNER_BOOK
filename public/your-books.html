<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recturner - Your Books</title>
    <link rel="shortcut icon" href="R.jpg" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: cursive;
            margin: 0;
            padding: 10px;
            font-size:auto;
        }

        body, html {
            font-family: cursive;
            background-color: #fffdf7;
            padding-top: 30px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            margin-top: 30px;
            text-align: center;
            margin-bottom: 30px;
        }

        .book-list {
            display: flex;
            flex-direction: column;
        }

        .book-item {
            display: flex;
            align-items: flex-start;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 15px;
            margin-bottom: 20px;
        }

        .book-item img {
            max-width: 150px;
            border-radius: 5px;
            margin-left: 15px;
        }

        .book-details {
            flex: 1;
        }

        .book-item h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .book-item p {
            margin-bottom: 5px;
        }

        .rating {
            font-weight: bold;
        }

        .top-review {
            margin-top: 10px;
        }

        body, html {
            font-family: Arial, sans-serif;
            background-color: #f9f6ef;
            color: #333;
        }

        .book-item {
            background-color: #fffdf7;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        a{
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="../homepage.html"><div class="logo">Recturner</div></a>
        <div class="nav-links">
            <a href="../homepage.html">Home</a>
            <a href="../profile.html">Profile</a>
            <a href="../your-books.html">Your Books</a>
            <a href="../about.html">About</a>
            <a href="../signup.html">Sign Up</a>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Explore New Books">
            <button id="search-btn">Search</button>
            <ul id="suggestions-list"></ul> <!-- Suggestions list -->
        </div>
    </div>

    <!-- Main Content -->
    <h1>Your Books</h1>
    <div class="container">
        <div class="book-list" id="your-books-container"></div> <!-- Container for dynamically loaded books -->
    </div>

    <script src="your-books.js"></script> <!-- Link to your JavaScript file -->
</body>
</html>
