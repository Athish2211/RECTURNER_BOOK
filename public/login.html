<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recturner - Login</title>
    <link rel="shortcut icon" href="R.jpg" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 10px;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 30px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        body, html {
            height: 100%;
            font-family: cursive;
            background-color: #f7f7f7;
            padding: 0px;
        }

        .background {
            background-image: url("bookshelf.jpeg");
            background-size: cover;
            background-position: center;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            width: 400px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-group label {
            flex-basis: 40%;
            font-size: 16px;
            font-weight: bold;
        }

        .form-group input {
            flex-basis: 60%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .login-form button {
            padding: 12px;
            background-color: #0284c7; 
            color: white; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size :16px;
            position: relative center; 
        }
       
        .login-form button:hover { 
            background-color :#025e92; 
        }
       
        .others { 
            text-align: center; 
            font-size: 20px; 
        }
    </style>
</head>
<body>

    <div class="background">
        <div class="logo">Recturner</div>
        <div class="container">
            <h1>Login</h1>
            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="email">Email ID:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required minlength="8">
                </div>

                <button type="submit">Login</button>
                <div class="others">If not a user, <a href="signup.html">Sign Up</a></div>
            </form>
        </div>
    </div>
    <script src="script.js"></script> <!-- Link to your JavaScript file -->
</body>
</html>
